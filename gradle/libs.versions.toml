# ============================================================
# JEMIL — Version Catalog
# Source unique de vérité pour TOUTES les versions.
# Pour mettre à jour une lib : changer la version ici seulement.
# ============================================================

[versions]
# Core
spring-boot                  = "3.2.4"
spring-dependency-management = "1.1.4"

# Data
liquibase                    = "4.27.0"
postgresql                   = "42.7.3"

# Security
jjwt                         = "0.12.5"

# Messaging
rabbitmq-amqp                = "5.20.0"

# Mapping
mapstruct                    = "1.5.5.Final"

# Observability
logstash-encoder             = "7.4"
micrometer-tracing            = "1.2.4"

# Code quality
spotless                     = "6.25.0"
palantir-format              = "2.39.0"
error-prone                  = "2.26.1"
error-prone-plugin           = "3.1.0"
checkstyle                   = "10.14.2"
sonarqube                    = "4.4.1.3373"
jacoco                       = "0.8.11"
archunit                     = "1.3.0"

# OpenAPI
openapi-generator            = "7.4.0"
springdoc                    = "2.4.0"

# Testing
cucumber                     = "7.16.1"
rest-assured                 = "5.4.0"
testcontainers               = "1.19.7"
assertj                      = "3.25.3"
mockito                      = "5.11.0"

# ============================================================
[libraries]
# ── Spring Boot ──────────────────────────────────────────────
spring-boot-starter-web        = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-data-jpa   = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-actuator   = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-amqp       = { module = "org.springframework.boot:spring-boot-starter-amqp" }
spring-boot-starter-security   = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-test       = { module = "org.springframework.boot:spring-boot-starter-test" }

# ── Data ────────────────────────────────────────────────────
liquibase-core    = { module = "org.liquibase:liquibase-core",        version.ref = "liquibase" }
postgresql        = { module = "org.postgresql:postgresql",           version.ref = "postgresql" }

# ── Security ────────────────────────────────────────────────
jjwt-api          = { module = "io.jsonwebtoken:jjwt-api",            version.ref = "jjwt" }
jjwt-impl         = { module = "io.jsonwebtoken:jjwt-impl",           version.ref = "jjwt" }
jjwt-jackson      = { module = "io.jsonwebtoken:jjwt-jackson",        version.ref = "jjwt" }

# ── Mapping ─────────────────────────────────────────────────
mapstruct           = { module = "org.mapstruct:mapstruct",           version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }

# ── OpenAPI / Docs ──────────────────────────────────────────
springdoc-openapi   = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

# ── Observability ────────────────────────────────────────────
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstash-encoder" }
micrometer-tracing-bridge = { module = "io.micrometer:micrometer-tracing-bridge-brave", version.ref = "micrometer-tracing" }

# ── Architecture Tests ───────────────────────────────────────
archunit-junit5     = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

# ── Cucumber ─────────────────────────────────────────────────
cucumber-java           = { module = "io.cucumber:cucumber-java",                   version.ref = "cucumber" }
cucumber-spring         = { module = "io.cucumber:cucumber-spring",                 version.ref = "cucumber" }
cucumber-junit-platform = { module = "io.cucumber:cucumber-junit-platform-engine",  version.ref = "cucumber" }

# ── Testing ──────────────────────────────────────────────────
rest-assured              = { module = "io.rest-assured:rest-assured",              version.ref = "rest-assured" }
rest-assured-json-path    = { module = "io.rest-assured:json-path",                 version.ref = "rest-assured" }
assertj-core              = { module = "org.assertj:assertj-core",                  version.ref = "assertj" }
mockito-core              = { module = "org.mockito:mockito-core",                  version.ref = "mockito" }

# ── Testcontainers ───────────────────────────────────────────
testcontainers-bom        = { module = "org.testcontainers:testcontainers-bom",     version.ref = "testcontainers" }
testcontainers-core       = { module = "org.testcontainers:testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }
testcontainers-rabbitmq   = { module = "org.testcontainers:rabbitmq" }
testcontainers-junit      = { module = "org.testcontainers:junit-jupiter" }

# ============================================================
[plugins]
spring-boot               = { id = "org.springframework.boot",        version.ref = "spring-boot" }
spring-dependency-mgmt    = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
spotless                  = { id = "com.diffplug.spotless",            version.ref = "spotless" }
openapi-generator         = { id = "org.openapi.generator",            version.ref = "openapi-generator" }
sonarqube                 = { id = "org.sonarqube",                    version.ref = "sonarqube" }
error-prone               = { id = "net.ltgt.errorprone",              version.ref = "error-prone-plugin" }
