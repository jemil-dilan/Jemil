name: Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: jemil_test
          POSTGRES_USER: jemil
          POSTGRES_PASSWORD: jemil_secret
        options: >-
          --health-cmd "pg_isready -U jemil -d jemil_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: jemil_test
          DB_USER: jemil
          DB_PASSWORD: jemil_secret
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-build-secret-key-that-is-at-least-32-bytes-long' }}

      - name: Upload JaCoCo Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/
