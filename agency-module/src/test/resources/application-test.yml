# Propriétés de test - surchargent application.yml
# Testcontainers injecte les vraies valeurs via @DynamicPropertySource

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true   # utile pendant les tests pour voir les requêtes

  liquibase:
    enabled: true

logging:
  level:
    cm.jemil: DEBUG
    org.springframework.web: DEBUG
