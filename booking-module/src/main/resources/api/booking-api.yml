openapi: 3.0.3
info:
  title: JEMIL Booking API
  description: API de gestion des réservations JEMIL Transport
  version: 1.0.0
  contact:
    name: JEMIL Team
    email: contact@jemil.cm

servers:
  - url: http://localhost:8082
    description: Serveur de développement local

paths:
  /api/bookings:
    post:
      summary: Créer une réservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
      responses:
        '201':
          description: Réservation créée avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '400':
          description: Requête invalide
        '404':
          description: Ressource non trouvée

  /api/bookings/{id}:
    get:
      summary: Obtenir une réservation par ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Réservation trouvée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '404':
          description: Réservation non trouvée

components:
  schemas:
    BookingRequest:
      type: object
      required:
        - routeId
        - passengerName
        - passengerPhone
      properties:
        routeId:
          type: string
          format: uuid
        passengerName:
          type: string
        passengerPhone:
          type: string
        seatNumber:
          type: string

    BookingResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        routeId:
          type: string
          format: uuid
        passengerName:
          type: string
        passengerPhone:
          type: string
        seatNumber:
          type: string
        status:
          type: string
          enum: [PENDING, CONFIRMED, CANCELLED]
        createdAt:
          type: string
          format: date-time
