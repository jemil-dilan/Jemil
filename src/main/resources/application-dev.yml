---
spring:
  application:
    name: "nyi-backend"
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nyi_db}"
    username: "${DB_USER:nyi}"
    password: "${DB_PASSWORD:nyi_secret}"
    driver-class-name: "org.postgresql.Driver"
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: "validate"
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: "public"
  liquibase:
    change-log: "classpath:db/changelog/db.changelog-master.xml"
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/nyi}"
management:
  endpoints:
    web:
      exposure:
        include: "health, info, metrics"
  endpoint:
    health:
      show-details: "when-authorized"
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  level:
    cm.nyi: "DEBUG"
    org.springframework: "INFO"
    org.hibernate.SQL: "WARN"
jwt:
  secret: "${JWT_SECRET:nyi-default-secret-key-change-in-production-32chars}"
  access-token-expiration: "${JWT_ACCESS_EXPIRATION:900000}"
  refresh-token-expiration: "${JWT_REFRESH_EXPIRATION:604800000}"
springdoc:
  api-docs:
    path: "/api-docs"
  swagger-ui:
    path: "/swagger-ui.html"
    operationsSorter: "method"
server:
  port: 8080
