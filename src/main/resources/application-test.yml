---
spring:
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jemil_test}"
    username: "${DB_USER:jemil}"
    password: "${DB_PASSWORD:jemil_secret}"
  jpa:
    hibernate:
      ddl-auto: "validate"
  liquibase:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/jemil}"
cors:
  allowed-origins: "*"
jwt:
  secret: "${JWT_SECRET:test-secret-key-that-is-at-least-32-bytes-long-for-hmac}"
  access-token-expiration: "${JWT_ACCESS_EXPIRATION:3600000}"
  refresh-token-expiration: "${JWT_REFRESH_EXPIRATION:604800000}"
