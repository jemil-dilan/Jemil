---
openapi: "3.0.3"
info:
  title: "JEMIL Transport Backend"
  description: "Booking Domain Events for JEMIL Transport System"
  version: "2026-W27"
servers:
  - url: "https"
  - url: "http"
tags:
  - name: "JEMIL"
    description: "Booking domain operations"
paths: {}
components:
  schemas:
    DomainEventType:
      type: "string"
      enum:
        - "BOOKING_CREATED"
        - "BOOKING_CONFIRMED"
        - "BOOKING_CANCELLED"
        - "BOOKING_EXPIRED"
        - "DEMO_CREATED"
    BookingCreatedEventDTO:
      type: "object"
      properties:
        eventId:
          type: "string"
          format: "uuid"
        bookingId:
          type: "string"
          format: "uuid"
        passengerId:
          type: "string"
          format: "uuid"
        routeId:
          type: "string"
          format: "uuid"
        occurredAt:
          type: "string"
          format: "date-time"
    BookingConfirmedEventDTO:
      type: "object"
      properties:
        eventId:
          type: "string"
          format: "uuid"
        bookingId:
          type: "string"
          format: "uuid"
        confirmedAt:
          type: "string"
          format: "date-time"
    DemoCreatedEventDTO:
      type: "object"
      properties:
        demoId:
          type: "string"
          format: "uuid"
        demoName:
          type: "string"
