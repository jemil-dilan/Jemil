---
openapi: "3.0.3"
info:
  title: "NYI Transport Backend"
  description: "Domain Events for NYI Transport System"
  version: "2026-W27"
servers:
  - url: "https"
  - url: "http"
tags:
  - name: "NYI"
    description: "Transport domain operations"
paths: {}
components:
  schemas:
    DomainEventType:
      type: "string"
      enum:
        - "AGENCY_REGISTERED"
        - "DEMO_CREATED"
    AgencyRegisteredEventDTO:
      type: "object"
      properties:
        eventId:
          type: "string"
          format: "uuid"
        agencyId:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        occurredAt:
          type: "string"
          format: "date-time"
    DemoCreatedEventDTO:
      type: "object"
      properties:
        demoId:
          type: "string"
          format: "uuid"
        demoName:
          type: "string"
