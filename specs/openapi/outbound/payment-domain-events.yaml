---
openapi: "3.0.3"
info:
  title: "JEMIL Transport Backend"
  description: "Payment Domain Events for JEMIL Transport System"
  version: "2026-W27"
servers:
  - url: "https"
  - url: "http"
tags:
  - name: "JEMIL"
    description: "Payment domain operations"
paths: {}
components:
  schemas:
    DomainEventType:
      type: "string"
      enum:
        - "PAYMENT_INITIATED"
        - "PAYMENT_COMPLETED"
        - "PAYMENT_FAILED"
        - "PAYMENT_REFUNDED"
        - "DEMO_CREATED"
    PaymentInitiatedEventDTO:
      type: "object"
      properties:
        eventId:
          type: "string"
          format: "uuid"
        paymentId:
          type: "string"
          format: "uuid"
        bookingId:
          type: "string"
          format: "uuid"
        amount:
          type: "number"
          format: "double"
        currency:
          type: "string"
        occurredAt:
          type: "string"
          format: "date-time"
    PaymentCompletedEventDTO:
      type: "object"
      properties:
        eventId:
          type: "string"
          format: "uuid"
        paymentId:
          type: "string"
          format: "uuid"
        transactionId:
          type: "string"
        completedAt:
          type: "string"
          format: "date-time"
    DemoCreatedEventDTO:
      type: "object"
      properties:
        demoId:
          type: "string"
          format: "uuid"
        demoName:
          type: "string"
