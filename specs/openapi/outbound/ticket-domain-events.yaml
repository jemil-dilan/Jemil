---
openapi: "3.0.3"
info:
  title: "JEMIL Transport Backend"
  description: "Ticket Domain Events for JEMIL Transport System"
  version: "2026-W27"
servers:
  - url: "https"
  - url: "http"
tags:
  - name: "JEMIL"
    description: "Ticket domain operations"
paths: {}
components:
  schemas:
    DomainEventType:
      type: "string"
      enum:
        - "TICKET_ISSUED"
        - "TICKET_VALIDATED"
        - "TICKET_CANCELLED"
        - "DEMO_CREATED"
    TicketIssuedEventDTO:
      type: "object"
      properties:
        eventId:
          type: "string"
          format: "uuid"
        ticketId:
          type: "string"
          format: "uuid"
        bookingId:
          type: "string"
          format: "uuid"
        passengerId:
          type: "string"
          format: "uuid"
        routeId:
          type: "string"
          format: "uuid"
        issuedAt:
          type: "string"
          format: "date-time"
    TicketValidatedEventDTO:
      type: "object"
      properties:
        eventId:
          type: "string"
          format: "uuid"
        ticketId:
          type: "string"
          format: "uuid"
        validatedAt:
          type: "string"
          format: "date-time"
        validatedBy:
          type: "string"
          format: "uuid"
    DemoCreatedEventDTO:
      type: "object"
      properties:
        demoId:
          type: "string"
          format: "uuid"
        demoName:
          type: "string"
