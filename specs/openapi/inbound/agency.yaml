---
openapi: "3.0.3"
info:
  title: "JEMIL Agency API"
  description: "API for managing partner transport agencies in the JEMIL platform.
    
    This contract is the single source of truth between the backend and clients 
    (Android mobile app, agency web dashboard, QA team).
    
    **Rule**: Any modification to this file requires review.
    Code is generated from this spec — not the other way around."
  version: "2026-W02"
  contact:
    name: "JEMIL Dev Team"

servers:
  - url: "http://localhost:8080"
    description: "Local development"
  - url: "https://api.jemil.cm"
    description: "Production"

tags:
- name: "Demo"
  description: "Demo operations"
- name: "City"
  description: "Cities management"
- name: "Agency"
  description: "Agency and Branch operations"
paths:
  /cities:
    get:
      tags:
        - "City"
      summary: "Get all cities"
      operationId: "getAllCities"
      parameters:
        - name: "page"
          in: "query"
          required: false
          schema:
            type: "integer"
            default: 0
        - name: "size"
          in: "query"
          required: false
          schema:
            type: "integer"
            default: 20
      responses:
        '200':
          description: "Successful operation"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseDTO'
    post:
      tags:
        - "City"
      summary: "Create a new city"
      operationId: "createCity"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCityDTO'
      responses:
        '201':
          description: "City created successfully"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreationResponseDTO'

  /demo:
    get:
      tags:
      - "Demo"
      summary: "Fetch all Demos"
      description: "Fetch all Demos"
      operationId: "fetchAllDemo"
      security:
      - oAuth:
        - "demo:read:all"
      parameters:
      - name: "fieldsToExtractCode"
        in: "query"
        required: true
        schema:
          type: "string"
        description: "specify the fields that will be present on the response"
      responses:
        "200":
          description: "successful operation"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/DemoDTO"
    post:
      tags:
      - "Demo"
      summary: "Create a new Demo"
      description: "Create a new Demo"
      operationId: "createDemo"
      security:
      - oAuth:
        - "demo:create"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDemoDTO"
      responses:
        "201":
          description: "successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreationResponseDTO"
  /demo/{demoId}:
    get:
      tags:
        - "Demo"
      summary: "Fetch demo by id"
      description: "Fetch demo by id"
      operationId: "fetchDemoById"
      security:
        - oAuth:
            - "demo:read"
      parameters:
        - name: "demoId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
          description: "represents the id of demo to fetch."
        - name: "fieldsToExtractCode"
          in: "query"
          required: true
          schema:
            type: "string"
          description: "specify the fields that will be present on the response"
      responses:
        "200":
          description: "successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoDTO"
        "404":
          description: "SPRING_BOOT_TEMPLATE-404-001"
  /agency:
    post:
      tags:
        - "Agency"
      summary: "Create a new agency (Legal Entity)"
      description: "Create a new Agency. Note: Agencies represent the legal entity. Physical locations belong to Branches."
      operationId: "registerAgency"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgencyDTO'
      responses:
        '201':
          description: "Successful operation"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreationResponseDTO'
        '400':
          description: "Bad Request"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '409':
          description: "An agency with this name already exists"
    get:
      tags:
        - "Agency"
      summary: "Get all agencies"
      description: "Get all agencies. Can be filtered by city."
      operationId: "getAllAgencies"
      parameters:
        - name: "city"
          in: "query"
          required: false
          schema:
            type: "string"
        - name: "page"
          in: "query"
          required: false
          schema:
            type: "integer"
            default: 0
        - name: "size"
          in: "query"
          required: false
          schema:
            type: "integer"
            default: 20
      responses:
        '200':
          description: "Successful operation"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseDTO'

  /agency/{agencyId}:
    get:
      tags:
        - "Agency"
      summary: "Get agency by ID with all its branches"
      operationId: "getAgencyById"
      parameters:
        - name: "agencyId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        '200':
          description: "Successful operation"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgencyDTO'
        '404':
          description: "Agency not found"

  /agency/{agencyId}/branches:
    post:
      tags:
        - "Agency"
      summary: "Add a physical branch to an agency"
      description: "Links a physical departure point (e.g., Gare Makepe) to an Agency in a specific City."
      operationId: "addAgencyBranch"
      parameters:
        - name: "agencyId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBranchDTO'
      responses:
        '201':
          description: "Successful operation"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgencyBranchDTO'
        '400':
          description: "Invalid data provided"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '404':
          description: "Agency or City not found"

  /agency/{agencyId}/routes:
    post:
      tags:
        - "Agency"
      summary: "Add a route to an agency"
      operationId: "addRouteToAgency"
      parameters:
        - name: "agencyId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddRouteDTO'
      responses:
        '201':
          description: "Successful operation"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteDTO'
        '400':
          description: "Invalid data provided"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '404':
          description: "Agency or City not found"

components:
  schemas:
    DemoDTO:
      type: "object"
      required:
      - "id"
      - "name"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
    CreateDemoDTO:
      type: "object"
      required:
      - "name"
      properties:
        name:
          type: "string"
    CreationResponseDTO:
      type: "object"
      required:
      - "newId"
      properties:
        newId:
          type: "string"
          format: "uuid"
    PhoneNumberDTO:
      type: "object"
      properties:
        countryCode:
          type: "string"
          description: "the international code for the country"
          example: "237 for Cameroon"
        number:
          type: "string"
          description: "the phone number"
          example: 653492410
    PageResponseDTO:
      type: "object"
      properties:
        content:
          type: "array"
          items:
            type: "object"
          description: "The actual data items"
        totalElements:
          type: "integer"
          description: "Total number of items available"
        totalPages:
          type: "integer"
          description: "Total number of pages"
        size:
          type: "integer"
          description: "Number of items per page"
        number:
          type: "integer"
          description: "Current page number (0-based)"

    AddressDTO:
      type: "object"
      properties:
        city:
          $ref: "#/components/schemas/CityDTO"
        district:
          type: "string"
          description: "the district of collector"
    CityDTO:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
          example: "Douala"
        region:
          type: "string"
          example: "Littoral"

    CreateCityDTO:
      type: "object"
      required:
        - "name"
        - "region"
      properties:
        name:
          type: "string"
          example: "Bafoussam"
        region:
          type: "string"
          example: "Littoral"
    AgencyBranchDTO:
      type: "object"
      description: "Represents a physical location/gare for an agency."
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
          example: "Gare Makepe"
        address:
          $ref: "#/components/schemas/AddressDTO"
        isActive:
          type: "boolean"
        longitude:
          type: "integer"
          format: "double"
          example: 9.7458
        latitude:
          type: "string"
          format: "double"
          example: 4.0482
        createdAt:
          type: "string"
          format: "date-time"

    CreateAgencyDTO:
      type: "object"
      required:
        - "name"
        - "phoneNumber"
        - "licenseNumber"
        - "commissionRate"
      properties:
        name:
          type: "string"
        phoneNumber:
          $ref: "#/components/schemas/PhoneNumberDTO"
        licenseNumber:
          type: "string"
          description: "Agency license number delivered by transport authorities (MINT)"
        commissionRate:
          type: "number"
          format: "double"
          description: "The commission rate in percentage (e.g., 4.0)"
          example: 4.0

    AgencyDTO:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        phoneNumber:
          $ref: "#/components/schemas/PhoneNumberDTO"
        status:
          $ref: "#/components/schemas/StatusDTO"
        branches:
          type: "array"
          items:
            $ref: "#/components/schemas/AgencyBranchDTO"
        routeCount:
          type: "integer"
        licenseNumber:
          type: "string"
        commissionRate:
          type: "number"
          format: "double"
        createdAt:
          type: "string"
          format: "date-time"

    CreateBranchDTO:
      type: "object"
      required:
        - "name"
        - "address"
        - "cityId"
      properties:
        name:
          type: "string"
          description: "Name of the neighborhood or terminal (e.g., Gare Makepe, Station Bonaberi)"
          example: "Gare Makepe"
        address:
          type: "string"
          description: "Text landmark for the passenger"
          example: "Carrefour Total Makepe, near the market"
        cityId:
          type: "string"
          format: "uuid"
          description: "UUID of the city where the branch is located"

    AddRouteDTO:
      type: "object"
      required:
        - "originCityId"
        - "destinationCityId"
        - "price"
        - "totalSeats"
      properties:
        originCityId:
          type: "string"
          format: "uuid"
        destinationCityId:
          type: "string"
          format: "uuid"
        price:
          type: "number"
          format: "double"
          minimum: 1000
          example: 5000
        totalSeats:
          type: "integer"
          minimum: 10
          maximum: 100
    StatusDTO:
      enum:
        - "ACTIVE"
        - "SUSPENDED"
        - "INACTIVE"
    RouteDTO:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        agencyId:
          type: "string"
          format: "uuid"
        originCityId:
          type: "string"
          format: "uuid"
        originCityName:
          type: "string"
          example: "Douala"
        destinationCityId:
          type: "string"
          format: "uuid"
        destinationCityName:
          type: "string"
          example: "Yaoundé"
        price:
          type: "number"
          format: "double"
        totalSeats:
          type: "integer"
        active:
          type: "boolean"
    ErrorDTO:
      type: "object"
      properties:
        timestamp:
          type: "string"
          format: "date-time"
        status:
          type: "integer"
        error:
          type: "string"
          example: "VALIDATION_ERROR"
        message:
          type: "string"
          example: "Agency name is required"