---
openapi: "3.0.3"
info:
  title: "JEMIL Booking API"
  description: "Trip search, seat map, and passenger booking hold operations."
  version: "2026-W04"
  contact:
    name: "JEMIL Dev Team"

servers:
  - url: "http://localhost:8080"
    description: "Local development"
  - url: "https://api.jemil.cm"
    description: "Production"

tags:
  - name: "Trip"
    description: "Scheduled departures search"
  - name: "Booking"
    description: "Passenger booking holds"

paths:
  /trips/search:
    get:
      tags:
        - "Trip"
      summary: "Search scheduled trips by route and date"
      operationId: "searchTrips"
      parameters:
        - name: "originCityId"
          in: "query"
          required: true
          schema:
            type: "string"
            format: "uuid"
        - name: "destinationCityId"
          in: "query"
          required: true
          schema:
            type: "string"
            format: "uuid"
        - name: "serviceDate"
          in: "query"
          required: true
          schema:
            type: "string"
            format: "date"
      responses:
        "200":
          description: "Matching trips"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripSearchResponseDTO"
        "400":
          description: "Invalid search parameters"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDTO"

  /trips/{tripId}/seats:
    get:
      tags:
        - "Trip"
      summary: "Seat map availability for a trip (UC-P-02)"
      description: >
        Returns the bus layout and seat numbers that are currently HELD or SOLD.
        Clients poll this endpoint (e.g. every 20s) to refresh availability.
      operationId: "getTripSeats"
      parameters:
        - name: "tripId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "Seat map snapshot"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripSeatMapDTO"
        "404":
          description: "Trip not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDTO"

  /bookings:
    post:
      tags:
        - "Booking"
      summary: "Place a seat hold on a trip"
      operationId: "createBookingHold"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingHoldDTO"
      responses:
        "201":
          description: "Hold created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreationResponseDTO"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDTO"
        "404":
          description: "Trip not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDTO"
        "409":
          description: "Seat unavailable"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDTO"

components:
  schemas:
    TripSearchResponseDTO:
      type: "object"
      properties:
        content:
          type: "array"
          items:
            $ref: "#/components/schemas/TripDTO"
        totalElements:
          type: "integer"

    TripDTO:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        agencyId:
          type: "string"
          format: "uuid"
        agencyName:
          type: "string"
        routeId:
          type: "string"
          format: "uuid"
        originCityId:
          type: "string"
          format: "uuid"
        destinationCityId:
          type: "string"
          format: "uuid"
        departureAt:
          type: "string"
          format: "date-time"
        serviceDate:
          type: "string"
          format: "date"
        priceXaf:
          type: "integer"
        travelClass:
          type: "string"
        status:
          type: "string"
        seatsTotal:
          type: "integer"
        seatsRemaining:
          type: "integer"

    TripSeatMapDTO:
      type: "object"
      required:
        - "tripId"
        - "seatCount"
        - "layout"
        - "taken"
      properties:
        tripId:
          type: "string"
          format: "uuid"
        seatCount:
          type: "integer"
          description: "Physical seat count from bus.seat_count"
          minimum: 1
        layout:
          type: "string"
          description: "Bus layout encoding, e.g. 2-2 or 2+2"
          maxLength: 32
        taken:
          type: "array"
          description: "Seat numbers currently HELD or SOLD (not selectable)"
          items:
            type: "integer"
            minimum: 1

    CreateBookingHoldDTO:
      type: "object"
      required:
        - "tripId"
        - "seatNos"
        - "passengerName"
      properties:
        tripId:
          type: "string"
          format: "uuid"
        seatNos:
          type: "array"
          minItems: 1
          maxItems: 5
          items:
            type: "integer"
            minimum: 1
        passengerName:
          type: "string"
          maxLength: 160
        passengerMsisdn:
          type: "string"
          maxLength: 32

    BookingHoldResponseDTO:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        ref:
          type: "string"
        tripId:
          type: "string"
          format: "uuid"
        holdExpiresAt:
          type: "string"
          format: "date-time"
        amountXaf:
          type: "integer"
        seatNos:
          type: "array"
          items:
            type: "integer"

    CreationResponseDTO:
      type: "object"
      required:
        - "newId"
      properties:
        newId:
          type: "string"
          format: "uuid"

    ErrorDTO:
      type: "object"
      properties:
        timestamp:
          type: "string"
          format: "date-time"
        status:
          type: "integer"
        error:
          type: "string"
        message:
          type: "string"
